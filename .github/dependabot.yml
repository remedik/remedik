# Dependabot is two separate things, and only one of them is in this file.
#
# The one that is NOT here — Dependabot alerts and security updates — is a
# repository setting, and it is the one that matters. It is silent until an
# advisory is published against something this operator depends on, and then
# it opens one pull request with the fix. For a thing that runs with write
# access to somebody's cluster, being told about a CVE in a dependency is
# not optional.
#
# This file is the other one: routine version updates, on a schedule,
# whether or not anything is wrong. That is a choice, and its cost is
# attention. It opened five pull requests on the first push — five CI runs
# and five reviews for what is one decision — and a maintainer who stops
# reading them is worse off than one who never turned it on.
#
# So it is monthly and grouped, not weekly and per-dependency. Anything
# genuinely urgent arrives through the security half, which does not wait
# for the schedule.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Kubernetes libraries move together; separate pull requests for each
      # would never be mergeable on their own.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      # Everything else, patch and minor, as one review. A major version is
      # left on its own because it is a decision, not an update.
      go-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Minor and patch only. A major bump of an action in release.yml is a
      # decision about the pipeline that signs and publishes this operator,
      # and it should arrive on its own with its changelog attached.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
