name: Scorecard

# OpenSSF Scorecard grades a repository's supply-chain posture against
# checks the industry has agreed are worth having: are the actions pinned,
# is the default branch protected, are releases signed, is there a security
# policy, is a dependency-update bot running, does CI actually run tests.
#
# It is here for the same reason `make verify` exists — a claim about this
# project's hygiene should be something a stranger can check rather than
# something the README asserts.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"

permissions: read-all

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest

    # Scorecard publishes to the code-scanning API, which needs GitHub
    # Advanced Security on a private repository and is free on a public one.
    # Gated rather than left permanently red while this repository is
    # private; it starts working by itself the day it goes public.
    if: github.event.repository.visibility == 'public'

    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing puts the score on the OpenSSF badge and in the public
          # dataset, which is the point: it is a claim somebody else can
          # check rather than one this repository makes about itself.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: results.sarif
