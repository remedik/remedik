name: CodeQL

# Static analysis for the kind of defect a linter does not find: a tainted
# path reaching an exec, a value crossing a trust boundary. Worth having in
# any Go project and hard to argue against in one that holds write access to
# a cluster and runs containers a strategy names.
#
# It is separate from CI because it is slower and because its findings go to
# the security tab rather than to a red check on a pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a rule added upstream is found without waiting for somebody
    # to touch the code it applies to.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest

    # Code scanning needs GitHub Advanced Security on a private repository,
    # and is free on a public one. Rather than leave a permanently red
    # workflow while this repository is private, it runs when it can — and
    # starts working by itself the day it goes public.
    if: github.event.repository.visibility == 'public'

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: go
          # Security-and-quality is the wider set. The noise it adds is
          # worth reading once for a project this size.
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: "/language:go"
