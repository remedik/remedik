name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Keep in sync with the pinned versions in the Makefile.
  HELM_VERSION: v3.21.4
  YAMLLINT_VERSION: 1.38.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install yamllint
        run: pip install "yamllint==${YAMLLINT_VERSION}"
      - name: Verify (gofmt, vet, golangci-lint, yamllint, helm lint, tests)
        run: make verify
      - name: Build
        run: make build
      - name: Check helm-docs is up to date
        run: |
          make helm-docs
          git diff --exit-code charts/

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
