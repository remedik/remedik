name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Keep in sync with the pinned versions in the Makefile.
  HELM_VERSION: v3.21.4
  YAMLLINT_VERSION: 1.38.0
  KIND_VERSION: v0.32.0

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hang would otherwise run to GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install yamllint
        run: pip install "yamllint==${YAMLLINT_VERSION}"
      - name: Verify (gofmt, vet, golangci-lint, yamllint, helm lint, tests)
        run: make verify
      - name: Build
        run: make build
      - name: Check generated code and CRDs are up to date
        run: make verify-codegen
      - name: Check helm-docs is up to date
        run: |
          make helm-docs
          git diff --exit-code charts/

  e2e:
    runs-on: ubuntu-latest
    # A hang would otherwise run to GitHub's six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}
      # sudo because /usr/local/bin on the hosted runner is root-owned: the
      # download lands but the chmod is refused, which is a confusing way to
      # fail a job that has nothing to do with permissions.
      - name: Install kind
        run: |
          sudo curl -fsSLo /usr/local/bin/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          kind version
      - name: End-to-end test on kind
        run: make e2e

  vuln:
    runs-on: ubuntu-latest
    # A hang would otherwise run to GitHub's six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # `make vuln` rather than an inline install: @latest is a moving
      # target, and this repository pins every other tool so a green run
      # yesterday means the same thing today.
      - name: govulncheck
        run: make vuln
