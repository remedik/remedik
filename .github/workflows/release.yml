name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # keyless signing with cosign

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@v5
        with:
          version: v3.21.4

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      # Keyless signing: the signature is bound to this workflow's identity,
      # so anyone can verify what built the image without a key to protect.
      - name: Sign the image
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Generate and attach an SBOM
        run: |
          syft "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" \
            -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Package and push the Helm chart
        run: |
          helm package charts/remedik --version "${GITHUB_REF_NAME#v}" \
            --app-version "${GITHUB_REF_NAME#v}"
          helm push "remedik-${GITHUB_REF_NAME#v}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sbom.spdx.json
            remedik-*.tgz
