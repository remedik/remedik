# Restart a Deployment whose pods are crash looping.
#
# The safest strategy to start with: a rollout restart is reversible, scoped
# to one workload, and is what an on-call engineer would do by hand anyway.
#
# Try it with the operator in dry-run (the install default): the Remediation
# record appears as Simulated with the exact plan, and nothing is touched.
#
# ---------------------------------------------------------------------------
# It needs an alert that names the workload, and the chart ships one
# ---------------------------------------------------------------------------
#
# This matches RemedikWorkloadCrashLooping, not kube-prometheus-stack's own
# KubePodCrashLooping. The difference is one label and it is the whole story.
#
# KubePodCrashLooping carries `namespace`, `pod`, `container` and `reason` --
# and no workload label. remedik will not guess a Deployment from a pod name,
# because a guess restarts the wrong workload during an incident, so a strategy
# matching it records:
#
#   no workload: the alert carries none of the "deployment", "statefulset" or
#   "daemonset" labels, and the step sets no "kind" and "name"
#
# The chart's own rule joins the ownership from kube-state-metrics instead of
# inferring it, and publishes the same condition with a `deployment` label:
#
#   helm upgrade remedik ... --set workloadAlerts.enabled=true
#
# Then route RemedikWorkloadCrashLooping to remedik and this works as written.
#
# Three alternatives, if that does not suit:
#
#   1. Your own alerts already carry a workload label -- many teams' do. Match
#      whichever alertname yours is and change nothing else.
#   2. Name the workload here, if this strategy is for one known workload.
#      Uncomment `deployment:` below, and scope the trigger too, or every crash
#      loop in the cluster restarts that one Deployment.
#   3. Act on the pod instead. `pod.delete` uses the `pod` label the stock
#      alert already carries -- see pod-not-ready.yaml. It is a weaker fix for
#      a crash loop, because the replacement pod usually crashes the same way,
#      but it needs nothing extra.
#
# This gap was found by pointing a real Prometheus at remedik and waiting the
# fifteen minutes for the rule to fire. Synthetic alerts in a test carry
# whatever labels the test author chose, which is why it went unnoticed.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: pod-crashloop
spec:
  enabled: true
  trigger:
    match:
      # From the chart's workloadAlerts. See the note above for why this is
      # not KubePodCrashLooping.
      alertname: RemedikWorkloadCrashLooping
  execution:
    mode: auto
  guards:
    # Do not restart the same workload again within 15 minutes: a crash loop
    # that survives one restart needs a human, not a second restart.
    cooldown: 15m
    # Cap the blast radius of an alert storm.
    maxPerHour: 4
  steps:
    - action: deployment.restart
      with:
        # Option 3 above: name the workload when the alert cannot.
        # deployment: api
        # How long to wait for the rollout to actually finish before calling
        # the step failed. Optional; 60s by default, 10m at most.
        #
        # This is what makes the record honest: without it a step would
        # report success the moment the API server accepted the patch, which
        # says nothing about whether the workload came back.
        verifyTimeout: 90s
  onFailure:
    # A restart that did not take effect is a failure, so this retry covers
    # the rollout that was merely slow as well as the patch that was
    # rejected.
    retries: 1
