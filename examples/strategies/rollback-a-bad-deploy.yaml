# Put the previous version back.
#
# The usual cause of a crash loop at 3am is the deploy at 2:50, and this is
# what an on-call engineer types. It is also the action most likely to
# surprise, for a reason that has nothing to do with Kubernetes:
#
#   In a GitOps cluster, Argo CD or Flux will revert the rollback within
#   minutes. remedik would record a success while the outage continued.
#
# So the action refuses a workload carrying their markers, and tells you to
# revert the commit instead. `ignoreGitOps: "true"` exists for somebody who
# has read that sentence and knows their cluster better.
#
# Pair it with a restart: try the cheap, reversible thing first, and only
# reach for the deploy history if the alert is still firing next time.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: rollback-a-bad-deploy
spec:
  enabled: true
  trigger:
    match:
      alertname: KubeDeploymentReplicasMismatch
  guards:
    # A rollback is a real change to what is running. Once an hour, and never
    # on a workload that is already mostly down.
    cooldown: 1h
    maxPerHour: 1
    blastRadius:
      minAvailable: 1
  steps:
    - action: deployment.rollback
      with:
        # Rolling one version back is the safe default. `toRevision` exists
        # for an operator who knows which one was actually good.
        verifyTimeout: 3m
  onFailure:
    retries: 0
