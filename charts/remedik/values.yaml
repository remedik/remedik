# remedik chart values — DESIGN CONTRACT
#
# NOTE: templates are not implemented yet. This file documents the intended
# values schema for v0.1.0 and is kept in sync with the specs in
# openspec/changes/add-mvp-core. Keys marked (v0.2.0) are later changes.

image:
  # -- Container image repository
  repository: ghcr.io/ratyx/remedik
  # -- Image tag; defaults to the chart appVersion
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Global execution posture. Install-time default is dry-run: remedik
# matches, evaluates guards and records Simulated remediations — it acts on
# nothing until you flip this.
dryRun: true

# -- Install profile: minimal / standard / full
profile: standard

gateway:
  # -- Port the Alertmanager webhook receiver listens on
  port: 8090
  auth:
    # -- Name of the Secret holding the bearer token Alertmanager must send
    bearerTokenSecretRef: ""

history:
  # -- Terminal Remediation records retained per strategy
  keepPerStrategy: 200

slack:
  # -- Enable the Socket Mode Slack bot — planned for v0.2.0
  enabled: false
  # -- Secret with the Slack app-level token — planned for v0.2.0
  appTokenSecretRef: ""
  # -- Secret with the Slack bot token — planned for v0.2.0
  botTokenSecretRef: ""

escalation:
  pagerduty:
    # -- Enable PagerDuty escalation — planned for v0.2.0
    enabled: false
    # -- Secret with the PagerDuty Events API routing key — planned for v0.2.0
    routingKeySecretRef: ""

audit:
  # -- Structured audit export sinks (splunk-hec, loki, elasticsearch, s3, webhook) — planned for v0.2.0
  sinks: []

ai:
  # -- Read-only BYO-LLM diagnosis, disabled by default — planned for v0.2.0
  enabled: false

# -- Cloud packs, e.g. `awsNodes: {enabled: true, auth: irsa}` — planned for v0.2.0
packs: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
