# remedik chart values.
#
# Every key here does something. Settings for features that are designed but
# not built are deliberately absent: a value that quietly does nothing is
# worse than a missing one, because somebody sets it, believes it, and finds
# out during an incident. The designs live in docs/advanced-setup.md, which
# says on its first line that nothing on it has shipped.

image:
  # -- Container image repository
  repository: ghcr.io/remedik/remedik
  # -- Image tag; defaults to the chart appVersion
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- How many operator replicas to run. One is enough: exactly one instance
# holds the lease, accepts alerts and reconciles, and the others wait. Two
# buys a faster handover when a node goes away — a standby that already has
# its caches warm, rather than a pod that has to be scheduled and started.
#
# It is safe to raise. A replica without the lease answers the gateway with
# 503 and reconciles nothing, so more replicas can never mean more
# remediation.
replicaCount: 1

# -- Default execution posture. The install default is dry-run: remedik
# matches alerts, evaluates guards and records Simulated remediations,
# changing nothing. Turn it off once the reports look right.
#
# Read this together with `namespacePosture` below: a namespace named there
# overrides this, so `dryRun: true` alone does not mean nothing acts.
dryRun: true

# -- Per-namespace overrides of `dryRun`, keyed by the namespace of the
# workload being remediated — not by remedik's own namespace. Each value is
# `live` (remedik acts) or `dryRun` (remedik only reports).
#
# This is how a cluster adopts remediation: live where it has been earned,
# reporting everywhere else, in one install.
#
#   dryRun: true                 # report by default
#   namespacePosture:
#     staging: live              # ...but act in staging
#
#   dryRun: false                # act by default
#   namespacePosture:
#     prod: dryRun               # ...but only report in prod
#
# A remediation whose target has no namespace — a node, a webhook — uses
# `dryRun` above. The posture is resolved once, when the record is created,
# and written onto it, so every Remediation says which posture it ran under
# and an in-flight execution keeps the one it started with.
#
# To stop everything immediately, scale the deployment to zero or disable
# the strategy; both are instant and neither needs a chart upgrade.
namespacePosture: {}

# -- A name for this cluster, shown in the dashboard's header and browser
# tab. Purely a label: remedik watches the cluster it runs in, so this is
# what tells three port-forwarded dashboards apart, not a filter.
clusterName: ""

# -- Log level: debug, info, warn or error
logLevel: info

gateway:
  # -- Port the Alertmanager webhook receiver listens on
  port: 8090
  # -- Path the Alertmanager webhook is served on
  path: /webhooks/alertmanager
  auth:
    # -- Bearer token Alertmanager must present. The chart creates a Secret
    # holding it. Prefer `existingSecret` in production so the value is not
    # in your values file.
    token: ""
    # -- Name of a Secret you manage that holds the bearer token
    existingSecret: ""
    # -- Key inside the token Secret
    secretKey: token
    # -- Disable authentication entirely. Local development only: anything
    # that can reach the service could then ask remedik to act.
    disabled: false

dashboard:
  # -- Serve the read-only web dashboard. Off by default: its pages disclose
  # alert labels, namespaces and workload names, and deciding who may see
  # those is the cluster owner's call, not the chart's. Enabling it grants
  # remedik no additional permission — the dashboard reads what the operator
  # already reads.
  enabled: false
  # -- Port the dashboard listens on
  port: 8082
  auth:
    # -- Token required to read the dashboard. The chart creates a Secret
    # holding it. Present it as a bearer token, or as the password in the
    # browser's own prompt (the username is ignored). Prefer
    # `existingSecret` in production so the value is not in your values file.
    token: ""
    # -- Name of a Secret you manage that holds the dashboard token
    existingSecret: ""
    # -- Key inside the token Secret
    secretKey: token
    # -- Serve the dashboard without authentication. Anything that can reach
    # the port could then read every alert label, namespace and workload
    # name remedik has recorded.
    disabled: false

metrics:
  # -- Port the Prometheus metrics endpoint listens on
  port: 8080

serviceMonitor:
  # -- Create a ServiceMonitor so the Prometheus Operator scrapes remedik.
  # Off by default because not every cluster uses the operator — but without
  # it, or an equivalent scrape config, remedik is instrumented and
  # unmonitored: a Service alone is not discovered.
  enabled: false
  # -- Namespace for the ServiceMonitor; defaults to the release namespace
  namespace: ""
  # -- Labels the ServiceMonitor needs to be selected. kube-prometheus-stack
  # selects on `release: <its release name>` by default, so this is usually
  # `{release: monitoring}`. A ServiceMonitor without it is created, ignored,
  # and hard to notice.
  additionalLabels: {}
  # -- How often Prometheus scrapes remedik
  interval: 30s
  # -- How long a scrape may take. The posture metrics read the operator's
  # cache, so a slow scrape means the cache is gone.
  scrapeTimeout: 10s
  # -- Relabelings applied before the scrape
  relabelings: []
  # -- Relabelings applied to the scraped metrics
  metricRelabelings: []

# The kill switch: stop remediation in one command, with no restart.
#
#   kubectl -n remedik patch configmap remedik-pause \
#     --type merge -p '{"data":{"paused":"true","reason":"network incident"}}'
#
# It takes effect within seconds, on every replica. It does NOT silence remedik
# -- it forces dry-run everywhere, whatever each namespace's posture says. That
# is deliberate: the one time you most want to know what remediation would have
# done is the moment you stopped it, so every record still appears, marked
# Simulated, carrying the plan and the reason you gave.
#
# remedik only reads this ConfigMap. It cannot un-pause itself, because a switch
# the tool can flip is not a switch.
pause:
  # -- Create the pause ConfigMap with the chart, so the command above works
  # without anybody having to create an object first at three in the morning
  create: true
  # -- Name of the ConfigMap holding the switch
  configMapName: remedik-pause
  # -- Start paused. For an install into a cluster mid-incident, or a rehearsal
  paused: false

# Alerts about YOUR workloads, carrying the label remedik needs to act on them.
#
# This exists because of a gap that catches every new user on their first day:
# kube-prometheus-stack's own KubePodCrashLooping carries `namespace`, `pod`,
# `container` and `reason` -- and no workload label. remedik will not guess a
# Deployment from a pod name, because a guess restarts the wrong workload during
# an incident, so the obvious first strategy records a failure and the obvious
# conclusion is that the tool is broken.
#
# These rules join the ownership from kube-state-metrics instead of guessing,
# and publish RemedikWorkloadCrashLooping, RemedikStatefulSetCrashLooping and
# RemedikWorkloadOOMKilling with a `deployment` or `statefulset` label. The
# cookbook's recipes match them.
#
# Off by default: they create alerts in your Prometheus, which is not something
# to do uninvited, and a cluster whose own alerts already carry workload labels
# does not need them. Needs the Prometheus Operator, as `prometheusRule` does.
workloadAlerts:
  # -- Ship alerting rules for your workloads that carry a workload label
  enabled: false
  # -- Namespace for the PrometheusRule; defaults to the release namespace
  namespace: ""
  # -- Labels this PrometheusRule needs to be selected. Defaults to
  # `prometheusRule.additionalLabels`, because it is the same label for the same
  # reason and setting it twice is how a rule file ends up created and never
  # loaded — with nothing anywhere reporting it.
  additionalLabels: {}
  # -- Severity label on the rules
  severity: warning
  # -- How long a crash loop must hold before it fires. Long enough that a
  # rollout in progress is not mistaken for one, short enough to be worth
  # remediating.
  crashLoopFor: 10m
  # -- The window the restart count is measured over.
  #
  # The crash-loop rules count restarts rather than reading
  # `kube_pod_container_status_waiting_reason`, which is the obvious metric and
  # the wrong one to depend on: kube-state-metrics 2.20 stopped publishing it,
  # so a rule written on it cannot fire at all on a current cluster and nothing
  # anywhere says so. Restarts have been in every version and are not going
  # away.
  #
  # Do not shorten this below 10m without also dropping the threshold to 1.
  # Kubernetes backs a crash loop off exponentially, capped at five minutes
  # between restarts, so a settled CrashLoopBackOff produces very few restarts
  # per window. Measured on a workload that had been failing for thirteen
  # minutes: 0 restarts in the last 3m, 1 in 5m, 2 in 10m. A 3m window with a
  # threshold of 2 can therefore never fire, which looks exactly like remedik
  # being broken.
  crashLoopWindow: 10m
  # -- How many restarts inside that window count as a crash loop. Two is a
  # container that died twice, which no healthy workload does.
  crashLoopThreshold: 2
  # -- How long an OOM kill must hold before it fires
  oomFor: 5m

prometheusRule:
  # -- Create a PrometheusRule alerting on remedik itself: down, ingest
  # failing, nothing matching, remediations failing, a guard that keeps
  # refusing, deliveries truncated, unauthenticated attempts. Something that
  # holds write access to a cluster should be watched by the same monitoring
  # it consumes.
  enabled: false
  # -- Namespace for the PrometheusRule; defaults to the release namespace
  namespace: ""
  # -- Labels the PrometheusRule needs to be selected, as for the ServiceMonitor
  additionalLabels: {}
  # -- How many refusals of one strategy by one guard in an hour count as
  # remedik having given up. A refusal on its own is remedik working
  # correctly; this many means the alert keeps arriving and remediation is not
  # resolving it, and a refusal creates no record and runs no escalation, so
  # nobody has been told.
  guardRefusalsPerHour: 6
  severity:
    # -- Severity label for the rule that fires when remedik is not scraped
    critical: critical
    # -- Severity label for the rest
    warning: warning

# -- Refuse an upgrade whose CRDs the cluster does not have.
#
# `helm upgrade` does not upgrade CRDs: Helm applies a chart's crds/ directory
# once, on first install, and never again. So a field added since your install
# is pruned silently by the API server rather than rejected — a strategy that
# asks for human approval can lose the field that makes it wait. The chart
# compares a stamp in each generated CRD with the one in the cluster and stops
# with the command that fixes it.
#
# Turn it off if you manage CRDs yourself and would rather not be asked.
crdCheck:
  # -- Compare the cluster's CRDs with the chart's before upgrading.
  enabled: true

grafanaDashboard:
  # -- Ship the remedik Grafana dashboard as a ConfigMap for the Grafana
  # sidecar to load. The JSON is versioned in the chart, so the dashboard is
  # the same in every cluster rather than living in one person's browser.
  enabled: false
  # -- Namespace for the ConfigMap; defaults to the release namespace.
  # The Grafana sidecar usually only watches its own namespace.
  namespace: ""
  # -- Label the Grafana sidecar watches for
  label: grafana_dashboard
  # -- Value of that label
  labelValue: "1"
  # -- Extra annotations, such as the sidecar's folder annotation
  annotations: {}

probes:
  # -- Port the health and readiness probes listen on
  port: 8081

networkPolicy:
  # -- Restrict who may reach remedik's ports. Off by default because a
  # policy naming the wrong peers stops Alertmanager silently, and silence is
  # this project's worst failure mode. Ingress only: remedik's one outbound
  # call is to the API server, whose address is specific to your cluster.
  enabled: false
  # -- Who may reach the gateway — the port that makes the cluster change
  # itself. Required when the policy is enabled. A list of NetworkPolicy
  # peers, for example:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  gatewayFrom: []
  # -- Who may scrape metrics. Defaults to whoever may reach the gateway,
  # which is right when Alertmanager and Prometheus are the same install.
  metricsFrom: []
  # -- Who may reach the read-only dashboard. Empty allows nothing, which is
  # the right default: reach it with `kubectl port-forward`, which the
  # kubelet proxies and a NetworkPolicy does not govern.
  dashboardFrom: []

# -- PriorityClass for the operator pod. A single-replica operator evicted
# under node pressure stops remediating without anyone being told, so on a
# busy cluster this is worth setting to something like `system-cluster-critical`.
priorityClassName: ""

history:
  # -- Terminal Remediation records retained per strategy
  keepPerStrategy: 200

  # -- Delete terminal records older than this, whatever the count allows.
  #
  # Empty keeps today's behaviour exactly: the count is the only policy. It is
  # empty rather than set to something reasonable because an upgrade must not
  # delete anybody's history on a default nobody chose.
  #
  # Set it the way your retention is actually expressed -- "30d", "90d" -- and
  # a sweep applies it every half hour, including to strategies that were
  # disabled, renamed or deleted. Those were the leak: pruning ran only when a
  # remediation completed, so a strategy that stopped running kept everything
  # it had ever made.
  #
  # remedik will never delete a record a guard is still relying on, whatever
  # this says. Guard state is rebuilt from records at startup, so a record
  # inside a cooldown or a giveUpAfter window is the reason remedik refuses to
  # act again -- and the operator logs when that floor overrides this setting.
  maxAge: ""

# -- How many remediations may be changing the cluster at the same moment.
#
# This is a blast-radius setting, not a throughput one. It is deliberately a
# fixed number rather than a CPU count: how much remedik changes in your
# cluster at once should not depend on which node the operator was scheduled
# on.
#
# It exists because one worker meant one remediation at a time, cluster-wide,
# for as long as it took -- and a step that waits for a pipeline's verdict
# takes minutes by design, so an ordinary escalation stalled everything else
# for half an hour.
#
# Raise it if remediations queue behind each other during a storm. Lower it to
# 1 to go back to strictly one at a time. Below 1 the operator refuses to
# start.
concurrency: 4

# Every action is a permission. What each one is allowed to do is listed,
# with its reasoning, in the chart's `action-rbac.yaml`: enabling an action
# adds exactly those rules, and disabling it removes them.
actions:
  deploymentRestart:
    # -- Enable `deployment.restart`: a rolling restart of a Deployment.
    # Disabling it also removes the RBAC rule that lets remedik patch
    # Deployments.
    enabled: true
  workloadRestart:
    # -- Enable `workload.restart`: the same rolling restart for Deployments,
    # StatefulSets and DaemonSets. Off by default because it grants patch on
    # all three; if you only ever restart Deployments, leave this off and use
    # `deployment.restart`.
    enabled: false
  podDelete:
    # -- Enable `pod.delete`: evicts one pod through the Eviction API, so a
    # PodDisruptionBudget can refuse it. It cannot delete pods outright — the
    # permission granted is `create` on `pods/eviction`, not `delete` on
    # `pods`. Refuses a pod with no controller owner, since nothing would
    # recreate it.
    enabled: false
  jobDelete:
    # -- Enable `job.delete`: deletes a failed Job, and its pods with it, so
    # the CronJob that owns it creates a clean run.
    enabled: false
  deploymentRollback:
    # -- Enable `deployment.rollback`: puts the previous revision back, the
    # way `kubectl rollout undo` does. The highest-value action here — the
    # usual cause of a 3am crash loop is the deploy ten minutes earlier — and
    # the one most likely to surprise: it refuses a workload Argo CD or Flux
    # manages, because they would revert it within minutes while remedik
    # recorded a success.
    enabled: false
  deploymentScale:
    # -- Enable `deployment.scale`: sets or increases replicas, bounded by a
    # maximum the strategy must state. Refuses a Deployment a
    # HorizontalPodAutoscaler owns, since the autoscaler would revert it.
    enabled: false
  hpaScale:
    # -- Enable `hpa.scale`: raises an autoscaler's `maxReplicas`, the one
    # mechanical answer to `KubeHpaMaxedOut`. It never lowers one.
    enabled: false
  nodeCordon:
    # -- Enable `node.cordon`: stop new work landing on a node. The safest
    # action here — nothing moves, nothing restarts, one command undoes it —
    # and the right first response to almost every node alert.
    enabled: false
  nodeUncordon:
    # -- Enable `node.uncordon`: the undo. Separate from the cordon so a
    # strategy can be granted one without the other.
    enabled: false
  nodeDrain:
    # -- Enable `node.drain`: cordon a node, then evict its pods through the
    # Eviction API, honouring PodDisruptionBudgets. **This is the widest
    # permission remedik holds** — `list` on pods and `create` on
    # `pods/eviction` across every namespace — and there is no narrower way
    # to drain a node. Enable it last, and leave it in dry-run longer than
    # the rest: the dry-run report names every pod that would move.
    enabled: false
  pvcExpand:
    # -- Enable `pvc.expand`: grow a PersistentVolumeClaim, but only where
    # the StorageClass allows expansion. Where it does not, the API accepts
    # the change and nothing happens, so the action checks first and refuses.
    # Expansion is one-way: Kubernetes cannot shrink a volume back.
    enabled: false
  webhookCall:
    # -- Enable `webhook.call`: POSTs the alert, the strategy and the plan to
    # a URL you configure, optionally with a token from a Secret in remedik's
    # namespace. The cheapest way to reach a pipeline remedik will never
    # implement, and it moves the blast radius outside the cluster.
    enabled: false
  jobRun:
    # -- Enable `job.run`: runs a container image as a Job in remedik's own
    # namespace, with the alert's labels as environment variables. The Job
    # runs under a ServiceAccount your strategy names — never remedik's,
    # which is refused — so its authority is granted deliberately rather than
    # inherited. This is the widest action in the catalogue; enable it when
    # you have decided which ServiceAccount it may use.
    enabled: false
  scriptRun:
    # -- Enable `script.run`: `job.run` with the script taken from a ConfigMap
    # in remedik's namespace, so a runbook can be edited without rebuilding an
    # image. The ConfigMap is read from remedik's namespace only: reading one
    # from anywhere else would let anyone with write access to any namespace
    # get code executed by the operator.
    enabled: false

# Guards bound what a strategy may do. Two of them — cooldown and maxPerHour
# — need nothing from the cluster and are always available. The third reads
# the workload it is protecting, so it is a permission like any other.
guards:
  blastRadius:
    # -- Allow strategies to use the `blastRadius` guard, which refuses to
    # remediate a workload that is already too degraded. Enabling it grants
    # read-only access to workloads, pods and replicasets so the guard can
    # see how much is available.
    #
    # A strategy that sets `blastRadius` in a cluster where this is off will
    # be **refused, not allowed**: a guard that cannot evaluate its own
    # condition must not permit the execution. The refusal names the missing
    # permission on the strategy's events.
    enabled: false

serviceAccount:
  # -- Create a ServiceAccount for the operator
  create: true
  # -- Name of the ServiceAccount; generated when empty
  name: ""
  # -- Annotations for the ServiceAccount (for example, cloud identity)
  annotations: {}

# -- Extra annotations for the operator pod
podAnnotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# -- Node selector for the operator pod
nodeSelector: {}
# -- Tolerations for the operator pod
tolerations: []
# -- Affinity for the operator pod
affinity: {}

# -- Override the chart name
nameOverride: ""
# -- Override the fully qualified release name
fullnameOverride: ""
