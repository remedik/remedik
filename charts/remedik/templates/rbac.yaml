{{/*
Permissions are assembled from what is actually enabled. remedik never asks
for cluster-admin: every rule below exists because a named feature needs
it, and turning that feature off removes the rule.

Action permissions come from action-rbac.yaml, one entry per action. That
file is the thing to read when reviewing what remedik may do; keeping it
out of the template means the answer is a table rather than a trail of
conditionals, which is what makes the invariant checkable rather than
merely stated.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "remedik.fullname" . }}
  labels:
    {{- include "remedik.labels" . | nindent 4 }}
rules:
  # Strategies are cluster-scoped and only ever read.
  - apiGroups: ["remedik.dev"]
    resources: ["remediationstrategies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["remedik.dev"]
    resources: ["remediationstrategies/status"]
    verbs: ["get", "update", "patch"]
  # Events explain remedik where people look: guard rejections on the
  # strategy, and each step's progress on the object being remediated. Both
  # land in namespaces remedik does not own — a strategy is cluster-scoped,
  # so its events go to `default`, and a remediated workload lives wherever
  # the alert said — so this cannot be narrowed to the release namespace.
  #
  # Two API groups, and it is not redundancy: the events.k8s.io group is the
  # current API and the core one is what older tooling still reads. remedik
  # writes through events.k8s.io; the core rule stays because Kubernetes
  # mirrors between them and dropping it silently loses events for anything
  # still watching the old group.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- $catalogue := .Files.Get "action-rbac.yaml" | fromYaml }}
{{- range $feature, $scopes := $catalogue }}
{{- $config := include "remedik.featureConfig" (dict "root" $ "key" $feature) | fromYaml }}
{{- if and $config.enabled $scopes.cluster }}
  # feature: {{ $feature }} — see action-rbac.yaml for why these verbs
  {{- toYaml $scopes.cluster | nindent 2 }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "remedik.fullname" . }}
  labels:
    {{- include "remedik.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "remedik.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "remedik.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{/*
Remediation records live in the release namespace only, so their
permissions are namespaced too.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "remedik.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remedik.labels" . | nindent 4 }}
rules:
  - apiGroups: ["remedik.dev"]
    resources: ["remediations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["remedik.dev"]
    resources: ["remediations/status"]
    verbs: ["get", "update", "patch"]
  # Leader election. Granted because exactly one instance may accept alerts
  # and reconcile: the guards hold their state in memory, so two instances
  # would each enforce a cooldown the other cannot see. In this namespace
  # only, and only on the operator's own lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # The kill switch. Read-only, on one ConfigMap in this namespace: remedik
  # never writes it, because the switch belongs to the person stopping
  # remediation and a tool that can un-stop itself is not a switch.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
    resourceNames: ["{{ .Values.pause.configMapName }}"]
{{- $catalogue := .Files.Get "action-rbac.yaml" | fromYaml }}
{{- range $feature, $scopes := $catalogue }}
{{- $config := include "remedik.featureConfig" (dict "root" $ "key" $feature) | fromYaml }}
{{- if and $config.enabled $scopes.namespaced }}
  # feature: {{ $feature }} — namespaced deliberately; see action-rbac.yaml
  {{- toYaml $scopes.namespaced | nindent 2 }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "remedik.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remedik.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "remedik.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "remedik.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
