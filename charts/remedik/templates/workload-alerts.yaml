{{- if (.Values.workloadAlerts).enabled }}
{{- /*
  Alerts about your workloads, carrying the label remedik needs to act on them.

  This exists because of a gap that catches every new user on their first day.
  kube-prometheus-stack's own KubePodCrashLooping carries `namespace`, `pod`,
  `container` and `reason` — and no workload label. remedik will not guess a
  Deployment from a pod name, because a guess restarts the wrong workload during
  an incident, so the obvious first strategy records a failure and the obvious
  conclusion is that the tool does not work.

  The fix is not a guess: kube-state-metrics publishes the ownership, so the
  workload can be joined in rather than inferred. A pod's ReplicaSet is named
  `<deployment>-<hash>`, so the Deployment is everything before the last dash.

  These are opt-in. They create alerts in somebody else's Prometheus, which is
  not a thing to do by default, and a cluster that already has workload-labelled
  alerts does not need them.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "remedik.fullname" . }}-workload-alerts
  namespace: {{ .Values.workloadAlerts.namespace | default .Release.Namespace }}
  labels:
    {{- include "remedik.labels" . | nindent 4 }}
    {{- /*
    Falls back to prometheusRule.additionalLabels when this is unset.

    Both values mean the same thing -- the label the Prometheus Operator's
    ruleSelector matches -- and having to set it twice in one chart produced the
    quietest possible failure: the rule file is created, the operator ignores it,
    Prometheus loads nothing, and no alert is ever raised. Nothing reports that.
    Somebody who has already told this chart which label their Prometheus wants
    has said it once, and once is enough.
  */}}
  {{- with (.Values.workloadAlerts.additionalLabels | default .Values.prometheusRule.additionalLabels) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: remedik.workloads
      rules:
        - alert: RemedikWorkloadCrashLooping
          {{- /*
            Counted from restarts, not from
            kube_pod_container_status_waiting_reason.

            That metric is the obvious one and the wrong one to depend on:
            kube-state-metrics 2.20 stopped publishing it. A rule written on it
            produces no series at all on a current cluster, so it never fires,
            and nothing anywhere reports that -- the rule is loaded, the alert
            is simply never raised. This was found by running the demo against a
            fresh kube-prometheus-stack and watching a genuinely crash-looping
            workload raise nothing.

            Restarts have been published by every version of kube-state-metrics
            and are not going away. OOM kills are excluded, because they restart
            too and want more memory rather than another restart -- which is
            what RemedikWorkloadOOMKilling is for.
          */}}
          expr: |
            max by (namespace, deployment) (
            label_replace(
              (
                increase(
                  kube_pod_container_status_restarts_total{job="kube-state-metrics"}[{{ .Values.workloadAlerts.crashLoopWindow | default "10m" }}]
                ) >= {{ .Values.workloadAlerts.crashLoopThreshold | default 2 }}
                unless on (namespace, pod, container)
                max_over_time(
                  kube_pod_container_status_last_terminated_reason{
                    job="kube-state-metrics", reason="OOMKilled"
                  }[{{ .Values.workloadAlerts.crashLoopWindow | default "10m" }}]
                ) >= 1
              )
              * on (namespace, pod) group_left (owner_name)
              kube_pod_owner{job="kube-state-metrics", owner_kind="ReplicaSet"},
              "deployment", "$1", "owner_name", "(.+)-[^-]+$"
            ) >= 1
            )
          for: {{ .Values.workloadAlerts.crashLoopFor | default "15m" }}
          labels:
            severity: {{ .Values.workloadAlerts.severity | default "warning" }}
          annotations:
            summary: >-
              {{ "{{ $labels.namespace }}/{{ $labels.deployment }}" }} is crash looping
            description: >-
              A container in
              {{ "{{ $labels.namespace }}/{{ $labels.deployment }}" }} has been
              in CrashLoopBackOff. This carries the `deployment` label, which is
              what lets a remediation act on the workload rather than on one of
              its pods.

        - alert: RemedikStatefulSetCrashLooping
          {{- /*
            A StatefulSet owns its pods directly, so owner_name is already the
            workload's name — no hash to strip, and no label_replace.
          */}}
          expr: |
            max by (namespace, statefulset) (
            (
              increase(
                kube_pod_container_status_restarts_total{job="kube-state-metrics"}[{{ .Values.workloadAlerts.crashLoopWindow | default "10m" }}]
              ) >= {{ .Values.workloadAlerts.crashLoopThreshold | default 2 }}
              unless on (namespace, pod, container)
              max_over_time(
                kube_pod_container_status_last_terminated_reason{
                  job="kube-state-metrics", reason="OOMKilled"
                }[{{ .Values.workloadAlerts.crashLoopWindow | default "10m" }}]
              ) >= 1
            )
            * on (namespace, pod) group_left (statefulset)
            label_replace(
              kube_pod_owner{job="kube-state-metrics", owner_kind="StatefulSet"},
              "statefulset", "$1", "owner_name", "(.+)"
            ) >= 1
            )
          for: {{ .Values.workloadAlerts.crashLoopFor | default "15m" }}
          labels:
            severity: {{ .Values.workloadAlerts.severity | default "warning" }}
          annotations:
            summary: >-
              {{ "{{ $labels.namespace }}/{{ $labels.statefulset }}" }} is crash looping
            description: >-
              A container in
              {{ "{{ $labels.namespace }}/{{ $labels.statefulset }}" }} has been
              in CrashLoopBackOff.

        - alert: RemedikWorkloadOOMKilling
          {{- /*
            Restarts caused by the kernel killing a container, which is a
            different problem from a crash loop and often wants a different
            remediation — more memory rather than another restart.
          */}}
          expr: |
            max by (namespace, deployment) (
            label_replace(
              (
                max_over_time(
                  kube_pod_container_status_last_terminated_reason{
                    job="kube-state-metrics", reason="OOMKilled"
                  }[15m]
                ) >= 1
              )
              * on (namespace, pod) group_left (owner_name)
              kube_pod_owner{job="kube-state-metrics", owner_kind="ReplicaSet"},
              "deployment", "$1", "owner_name", "(.+)-[^-]+$"
            ) >= 1
            )
          for: {{ .Values.workloadAlerts.oomFor | default "5m" }}
          labels:
            severity: {{ .Values.workloadAlerts.severity | default "warning" }}
          annotations:
            summary: >-
              {{ "{{ $labels.namespace }}/{{ $labels.deployment }}" }} is being OOM killed
            description: >-
              A container in
              {{ "{{ $labels.namespace }}/{{ $labels.deployment }}" }} was killed
              for exceeding its memory limit and restarted. Restarting it again
              buys time; the limit or the leak is the fix.
{{- end }}
