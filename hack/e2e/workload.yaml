# Two healthy Deployments standing in for the workloads an alert complains
# about. The test asserts on their pod-template restart annotation: absent
# after a dry run, present after a real remediation.
#
# Two of them, because a dry run records a cooldown for the target it
# simulated — faithfully, so that a dry-run report is not more optimistic
# than reality. The real-remediation phase therefore needs its own target.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: e2e-payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api2
  namespace: e2e-payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api2
  template:
    metadata:
      labels:
        app: api2
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
# A StatefulSet, so the test can prove workload.restart handles more than
# Deployments — the generalisation is the point of the action, and the
# rollout status it reads is a different set of fields per kind.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: e2e-payments
spec:
  serviceName: ledger
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
# A pod nothing owns. pod.delete must refuse it: deleting it would remove
# the workload rather than remediate it, and no controller would notice.
apiVersion: v1
kind: Pod
metadata:
  name: orphan
  namespace: e2e-payments
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
---
# A Deployment for deployment.scale. It is its own workload rather than a
# shared one because scaling refuses anything an HPA owns, and api2 has one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity
  namespace: e2e-payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capacity
  template:
    metadata:
      labels:
        app: capacity
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
# A Deployment for deployment.rollback. The test gives it a second revision
# and then asks remedik to put the first one back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipped
  namespace: e2e-payments
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: shipped
  template:
    metadata:
      labels:
        app: shipped
        release: good
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
# A Job for job.delete. Deleting it is what lets a CronJob schedule the next
# run, which is the reason the action exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: nightly-billing
  namespace: e2e-payments
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: work
          image: registry.k8s.io/pause:3.10
---
# A claim on kind's "standard" class, which does not allow expansion. It is
# here so pvc.expand has something real to refuse.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-data
  namespace: e2e-payments
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
# An autoscaler for hpa.scale. No metrics-server is installed, so it never
# actually scales anything — the action patches spec.maxReplicas, which is
# what is under test.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api2
  namespace: e2e-payments
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api2
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
# A second namespace, so the posture test can prove the combination rather
# than just that a flag is read: live here, reporting there, one install.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-reporting
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: e2e-reporting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
