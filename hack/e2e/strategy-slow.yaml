# Two strategies for the concurrency assertion: one that takes a long time and
# one that does not.
#
# The slow one waits for a Job that sleeps. That is not contrived -- it is what
# the cookbook recommends for handing an incident to a pipeline, because a
# pipeline API answers "queued" rather than "succeeded", so the only honest way
# to learn the outcome is to run something that waits for it.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-slow
spec:
  enabled: true
  trigger:
    match:
      alertname: E2ESlow
  guards:
    cooldown: 1s
    maxPerHour: 20
  steps:
    - action: job.run
      with:
        image: busybox:1.36
        command: '["sh","-c","sleep 45"]'
        backoffLimit: "0"
        ttlSecondsAfterFinished: "120"
        verifyTimeout: 90s
---
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-fast
spec:
  enabled: true
  trigger:
    match:
      alertname: E2EFast
  guards:
    cooldown: 1s
    maxPerHour: 20
  steps:
    - action: deployment.restart
      with:
        verifyTimeout: 60s
