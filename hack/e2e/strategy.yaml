apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-crashloop
spec:
  trigger:
    match:
      alertname: E2ECrashLooping
  guards:
    # Long enough that the test can prove a second alert is refused.
    cooldown: 30m
    maxPerHour: 10
  steps:
    - action: deployment.restart
  onFailure:
    retries: 0
---
# Restart a StatefulSet. The alert carries a `statefulset` label, which names
# the object and its kind at once.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-statefulset
spec:
  trigger:
    match:
      alertname: E2EStatefulSetStuck
  steps:
    - action: workload.restart
  onFailure:
    retries: 0
---
# Evict one pod. The guard is deliberately absent: the test sends two
# alerts, one for an owned pod and one for a bare pod, and needs both to be
# evaluated rather than the second refused by a cooldown.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-pod
spec:
  trigger:
    match:
      alertname: E2EPodStuck
  steps:
    - action: pod.delete
  onFailure:
    retries: 0
---
# Cordon a node. The safest action there is: nothing moves, nothing restarts.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-node-cordon
spec:
  trigger:
    match:
      alertname: E2ENodeNotReady
  steps:
    - action: node.cordon
  onFailure:
    retries: 0
---
# Drain a node: cordon, then evict everything eligible through the Eviction
# API. The widest thing remedik can do.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-node-drain
spec:
  trigger:
    match:
      alertname: E2ENodeUnreachable
  steps:
    - action: node.drain
      with:
        verifyTimeout: 3m
  onFailure:
    retries: 0
---
# A strategy the blastRadius guard must refuse: minAvailable is set higher
# than the workload can ever have, so remedik must decline to act on it.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-blast-radius
spec:
  trigger:
    match:
      alertname: E2EBlastRadius
  guards:
    blastRadius:
      minAvailable: 5
  steps:
    - action: deployment.restart
  onFailure:
    retries: 0
---
# Put a node back into service. The undo, so the test leaves the cluster as
# it found it.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-node-uncordon
spec:
  trigger:
    match:
      alertname: E2ENodeSchedulable
  steps:
    - action: node.uncordon
  onFailure:
    retries: 0
---
# Test 10 — the actions and the escalation path nothing else covers.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-job-delete
spec:
  trigger:
    match:
      alertname: E2EJobFailed
  steps:
    - action: job.delete
---
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-rollback
spec:
  trigger:
    match:
      alertname: E2EBadDeploy
  steps:
    - action: deployment.rollback
---
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-scale
spec:
  trigger:
    match:
      alertname: E2ENeedsCapacity
  steps:
    - action: deployment.scale
      with:
        increaseBy: "2"
        max: "6"
---
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-hpa-scale
spec:
  trigger:
    match:
      alertname: E2EHpaMaxed
  steps:
    - action: hpa.scale
      with:
        increaseBy: "3"
        max: "10"
---
# The claim cannot grow: kind's "standard" class does not set
# allowVolumeExpansion. The refusal is the behaviour under test — an action
# that reported success here would have changed nothing.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-pvc-expand
spec:
  trigger:
    match:
      alertname: E2EVolumeFilling
  steps:
    - action: pvc.expand
      with:
        size: 2Gi
---
# remedik's own gateway is the endpoint: it accepts POST, requires the bearer
# token from a Secret in the operator's namespace, and answers 200 to a body
# it understood. Nothing outside the cluster is needed to prove the path.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-webhook
spec:
  trigger:
    match:
      alertname: E2EWebhook
  steps:
    - action: webhook.call
      with:
        url: http://remedik-gateway.remedik.svc.cluster.local:8090/webhooks/alertmanager
        secretRef: remedik-gateway-token
        secretKey: token
        header: Authorization
        headerPrefix: "Bearer "
        timeout: 20s
---
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-job-run
spec:
  trigger:
    match:
      alertname: E2ERunbook
  steps:
    - action: job.run
      with:
        image: remedik:e2e
        command: '["/remedik", "--version"]'
        serviceAccount: e2e-runbook
        backoffLimit: "0"
        ttlSecondsAfterFinished: "600"
---
# The whole loop: a step that cannot succeed, then a page that can.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-escalation
spec:
  trigger:
    match:
      alertname: E2EEscalate
  steps:
    # There is no Deployment called "does-not-exist", so this always fails.
    - action: deployment.restart
  onFailure:
    retries: 0
    steps:
      - action: webhook.call
        with:
          url: http://remedik-gateway.remedik.svc.cluster.local:8090/webhooks/alertmanager
          secretRef: remedik-gateway-token
          secretKey: token
          header: Authorization
          headerPrefix: "Bearer "
          timeout: 20s
---
# The case that matters most: the remediation failed and so did the page.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-escalation-fails
spec:
  trigger:
    match:
      alertname: E2EEscalateBadly
  steps:
    - action: deployment.restart
  onFailure:
    retries: 0
    steps:
      - action: webhook.call
        with:
          url: http://remedik-gateway.remedik.svc.cluster.local:8090/webhooks/alertmanager
          # A real Secret, holding the wrong credential for this endpoint:
          # the gateway answers 401 and the escalation fails honestly.
          secretRef: e2e-wrong-token
          secretKey: token
          header: Authorization
          headerPrefix: "Bearer "
          timeout: 20s
---
# Test 11 — per-namespace posture. One strategy, matched by both namespaces,
# so the only thing that can differ is where the alert points.
apiVersion: remedik.dev/v1alpha1
kind: RemediationStrategy
metadata:
  name: e2e-posture
spec:
  trigger:
    match:
      alertname: E2EPosture
  steps:
    - action: deployment.restart
